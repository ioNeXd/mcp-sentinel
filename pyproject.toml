[project]  
name = "mcp-sentinel"  
dynamic = ["version"]  
requires-python = ">=3.10"  
  
[tool.setuptools.dynamic]  
version = {attr = "gateway.version.__version__"}  
  
[tool.ruff]  
target-version = "py310"  
line-length = 100  
exclude = [".venv", ".pytest_cache"]  
  
[tool.ruff.lint]  
select = ["E", "F"]  
ignore = ["E501"]  
  
[tool.mypy]  
python_version = "3.10"  
files = ["gateway"]  
ignore_missing_imports = true  
  
# O mesmo timeout vale localmente (não só no CI), e o modo do pytest-asyncio  
# fica fixado explicitamente para não depender do default do plugin.  
[tool.pytest.ini_options]  
timeout = 60  
timeout_method = "thread"  
asyncio_mode = "strict"