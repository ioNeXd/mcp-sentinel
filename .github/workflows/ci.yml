name: CI  
  
on:  
  push:  
  pull_request:  
  
jobs:  
  test:  
    runs-on: ${{ matrix.os }}  
    # Teto duro por job: sem isso, um teste travado prende o runner até o  
    # limite de 6h do GitHub. Com pytest-timeout abaixo isso quase nunca é  
    # atingido, mas fica como rede de segurança final.  
    timeout-minutes: 20  
    strategy:  
      fail-fast: false  
      matrix:  
        os: [ubuntu-latest, windows-latest]  
        python-version: ["3.10", "3.13"]  
    steps:  
      - uses: actions/checkout@v4  
      - uses: actions/setup-python@v5  
        with:  
          python-version: ${{ matrix.python-version }}  
      - run: python -m pip install -r requirements.txt  
      - run: python -m pip install ruff mypy  
      # -v imprime cada nome de teste antes de rodar; método padrão (signal)  
      # reporta QUAL teste estourou o timeout (o thread mata o processo sem  
      # dizer qual foi). Um teste que passar de 60s falha com o nome no log.  
      - run: pytest -q -v --timeout=60  
      - run: ruff check .  
      - run: mypy gateway/