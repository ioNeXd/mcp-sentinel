name: CI  
  
on:  
  push:  
  pull_request:  
  
jobs:  
  test:  
    runs-on: ${{ matrix.os }}  
    # Teto duro por job: sem isso, um teste travado prende o runner até o  
    # limite de 6h do GitHub. Com pytest-timeout abaixo isso quase nunca é  
    # atingido, mas fica como rede de segurança final.  
    timeout-minutes: 20  
    strategy:  
      fail-fast: false  
      matrix:  
        # macOS removido: não há código específico de macOS (o único código  
        # dependente de plataforma é o SIGBREAK do Windows em main.py) e é o  
        # runner que mais fica em fila. ubuntu = baseline POSIX; windows =  
        # cobre o caminho SIGBREAK/shutdown específico.  
        os: [ubuntu-latest, windows-latest]  
        # Só as pontas do range suportado (requires-python >=3.10): a mínima  
        # (3.10) e a máxima (3.13). 3.11/3.12 ficam de fora por raramente  
        # revelarem algo que as pontas não peguem.  
        python-version: ["3.10", "3.13"]  
    steps:  
      - uses: actions/checkout@v4  
      - uses: actions/setup-python@v5  
        with:  
          python-version: ${{ matrix.python-version }}  
      - run: python -m pip install -r requirements.txt  
      - run: python -m pip install ruff mypy  
      # --timeout-method=thread: os hangs aqui envolvem I/O de socket/subprocesso  
      # (não só o event loop), então o método de sinal não os interromperia.  
      # Um teste que passar de 60s falha com traceback do ponto do travamento.  
      - run: pytest -q --timeout=60 --timeout-method=thread  
      - run: ruff check .  
      - run: mypy gateway/