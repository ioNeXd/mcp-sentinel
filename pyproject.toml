[project]  
name = "mcp-sentinel"  
dynamic = ["version"]  
requires-python = ">=3.10"  
  
[tool.setuptools.dynamic]  
version = {attr = "gateway.version.__version__"}  
  
[tool.ruff]  
target-version = "py310"  
line-length = 100  
exclude = [".venv", ".pytest_cache"]  
  
[tool.ruff.lint]  
select = ["E", "F"]  
ignore = ["E501"]  
  
[tool.mypy]  
python_version = "3.10"  
files = ["gateway"]  
ignore_missing_imports = true  
  
# O mesmo timeout vale localmente (não só no CI). Sem timeout_method: o método  
# padrão (signal, no Linux/macOS) reporta qual teste travou. asyncio_mode fixo.  
[tool.pytest.ini_options]  
timeout = 60  
asyncio_mode = "strict"